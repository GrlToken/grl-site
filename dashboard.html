<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRL Network</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #fff; font-family: Consolas, monospace; color: #003366; min-height: 100vh; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid rgba(0,51,102,0.12); }
    .email { font-size: 12px; opacity: .5; }
    button { font-family: Consolas, monospace; font-size: 11px; color: #003366; background: transparent; border: 1px solid rgba(0,51,102,0.25); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
    .main { display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100vh - 49px); }
    .col { padding: 40px 24px; display: flex; flex-direction: column; align-items: center; }
    .col-fila { border-right: 1px solid rgba(0,51,102,0.10); justify-content: flex-start; order: 1; }
    .col-matriz { justify-content: center; order: 2; }
    .rotulo { font-size: 10px; letter-spacing: 3px; opacity: .3; text-transform: uppercase; margin-bottom: 24px; align-self: flex-start; }

    .contador { align-self: flex-start; margin-bottom: 32px; }
    .contador-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; opacity: .3; margin-bottom: 4px; }
    .contador-valor { font-size: 36px; font-weight: 700; color: #003366; opacity: .85; }

    .secao { width: 100%; margin-bottom: 24px; }
    .secao-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; opacity: .3; margin-bottom: 10px; }
    .bolinhas { display: flex; flex-wrap: wrap; gap: 8px; }

    .bolinha {
      width: 14px; height: 14px; border-radius: 50%;
      cursor: pointer; border: none; padding: 0;
      transition: transform .15s;
    }
    .bolinha:hover { transform: scale(1.3); }
    .bolinha.super { background: #003366; }
    .bolinha.ultra { background: #c9a84c; }

    .tooltip-card {
      display: none; position: fixed;
      background: #fff; border: 1px solid rgba(0,51,102,0.15);
      border-radius: 10px; padding: 14px 18px;
      font-size: 11px; z-index: 200;
      box-shadow: 0 4px 20px rgba(0,51,102,0.12);
      min-width: 210px;
    }
    .tooltip-card.ativo { display: block; }
    .tooltip-email { font-weight: 700; margin-bottom: 8px; font-size: 12px; }
    .tooltip-info { opacity: .6; font-size: 10px; line-height: 2; }
    .tooltip-fechar { position: absolute; top: 8px; right: 10px; font-size: 14px; cursor: pointer; opacity: .3; background: none; border: none; color: #003366; }

    svg { width: 100%; max-width: 300px; overflow: visible; }
    .link-area { margin-top: 40px; width: 100%; max-width: 300px; }
    .link-rotulo { font-size: 10px; letter-spacing: 2px; opacity: .3; text-transform: uppercase; margin-bottom: 8px; }
    .link { font-size: 10px; background: rgba(0,51,102,0.04); border: 1px solid rgba(0,51,102,0.12); border-radius: 8px; padding: 10px 12px; word-break: break-all; line-height: 1.6; margin-bottom: 8px; }

    .vazio-msg { font-size: 11px; opacity: .25; margin-top: 8px; }

    @media (max-width: 600px) {
      .main { grid-template-columns: 1fr; }
      .col-fila { order: 2; border-right: none; border-top: 1px solid rgba(0,51,102,0.10); }
      .col-matriz { order: 1; }
    }
  </style>
</head>
<body>

<header>
  <span class="email" id="email"></span>
  <button onclick="sair()">Sair</button>
</header>

<div class="main">

  <div class="col col-fila">
    <div class="rotulo">fila</div>

    <div class="contador">
      <div class="contador-label">vendas diretas</div>
      <div class="contador-valor" id="contador">0</div>
    </div>

    <div class="secao" id="secao-ultra" style="display:none">
      <div class="secao-label">ultra minds</div>
      <div class="bolinhas" id="fila-ultra"></div>
    </div>

    <div class="secao" id="secao-super" style="display:none">
      <div class="secao-label">super minds</div>
      <div class="bolinhas" id="fila-super"></div>
    </div>

    <div class="vazio-msg" id="vazio-msg">nenhum indicado ainda</div>
  </div>

  <div class="col col-matriz">
    <div class="rotulo">matriz</div>

    <svg viewBox="0 0 300 290">
      <line x1="97" y1="220" x2="203" y2="220" stroke="#003366" stroke-width="1" opacity=".2"/>

      <a href="masterminds.html" style="cursor:pointer">
        <circle cx="150" cy="60" r="22" fill="#003366"/>
        <text x="150" y="55" font-family="Consolas,monospace" font-size="7.5" fill="#fff" text-anchor="middle" dominant-baseline="middle">Master</text>
        <text x="150" y="67" font-family="Consolas,monospace" font-size="7.5" fill="#fff" text-anchor="middle" dominant-baseline="middle">Minds</text>
      </a>

      <circle cx="75" cy="220" r="22" fill="none" stroke="#003366" stroke-width="1.5" opacity=".25" id="circ-super"/>
      <text x="75" y="215" font-family="Consolas,monospace" font-size="7.5" fill="#003366" text-anchor="middle" dominant-baseline="middle" opacity=".6">Super</text>
      <text x="75" y="227" font-family="Consolas,monospace" font-size="7.5" fill="#003366" text-anchor="middle" dominant-baseline="middle" opacity=".6">Minds</text>

      <circle cx="225" cy="220" r="22" fill="none" stroke="#003366" stroke-width="1.5" opacity=".25" id="circ-ultra"/>
      <text x="225" y="215" font-family="Consolas,monospace" font-size="7.5" fill="#003366" text-anchor="middle" dominant-baseline="middle" opacity=".6">Ultra</text>
      <text x="225" y="227" font-family="Consolas,monospace" font-size="7.5" fill="#003366" text-anchor="middle" dominant-baseline="middle" opacity=".6">Minds</text>
    </svg>

    <div class="link-area">
      <div class="link-rotulo">link de convite</div>
      <div class="link" id="link"></div>
      <button onclick="copiar()">Copiar</button>
      <div style="font-size:10px;opacity:.35;margin-top:6px;min-height:14px" id="fb"></div>
    </div>
  </div>

</div>

<div class="tooltip-card" id="tooltip">
  <button class="tooltip-fechar" onclick="document.getElementById('tooltip').classList.remove('ativo')">✕</button>
  <div class="tooltip-email" id="tip-email"></div>
  <div class="tooltip-info" id="tip-info"></div>
</div>

<script type="module">
  import { auth, db } from "./firebase.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { collection, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  onAuthStateChanged(auth, async user => {
    if (!user) { location.href = "index.html"; return; }

    document.getElementById("email").textContent = user.email;
    document.getElementById("link").textContent = `https://grlnetwork.com/cadastro.html?ref=${user.uid}`;

    const snap = await getDocs(query(
      collection(db, "usuarios"),
      where("indicador", "==", user.uid),
      orderBy("ts", "asc")
    ));

    const lista = [];
    snap.forEach(d => lista.push(d.data()));

    if (!lista.length) return;

    document.getElementById("vazio-msg").style.display = "none";
    document.getElementById("contador").textContent = lista.length;

    const filaSuper = document.getElementById("fila-super");
    const filaUltra = document.getElementById("fila-ultra");
    let temSuper = false, temUltra = false;
    let melhorSuper = null, melhorUltra = null;

    for (const u of lista) {
      const subSnap = await getDocs(query(
        collection(db, "usuarios"),
        where("indicador", "==", u.uid)
      ));
      const temFilhos = !subSnap.empty;
      const diretas = u.diretas || 0;
      const indiretas = u.indiretas || 0;

      if (temFilhos) {
        temUltra = true;
        const btn = document.createElement("button");
        btn.className = "bolinha ultra";
        btn.addEventListener("click", e => mostrarTooltip(e, u.email, diretas, indiretas));
        filaUltra.appendChild(btn);
        if (!melhorUltra || indiretas > (melhorUltra.indiretas || 0)) melhorUltra = u;
      } else {
        temSuper = true;
        const btn = document.createElement("button");
        btn.className = "bolinha super";
        btn.addEventListener("click", e => mostrarTooltip(e, u.email, diretas, indiretas));
        filaSuper.appendChild(btn);
        if (!melhorSuper || diretas > (melhorSuper.diretas || 0)) melhorSuper = u;
      }
    }

    if (temSuper) document.getElementById("secao-super").style.display = "block";
    if (temUltra) document.getElementById("secao-ultra").style.display = "block";

    // Acende célula com os mais produtivos
    if (melhorSuper) {
      document.getElementById("circ-super").setAttribute("fill", "#003366");
      document.getElementById("circ-super").setAttribute("opacity", "1");
    }
    if (melhorUltra) {
      document.getElementById("circ-ultra").setAttribute("fill", "#003366");
      document.getElementById("circ-ultra").setAttribute("opacity", "1");
    }
  });

  function mostrarTooltip(e, email, diretas, indiretas) {
    const t = document.getElementById("tooltip");
    document.getElementById("tip-email").textContent = email;
    document.getElementById("tip-info").innerHTML =
      `vendas diretas: <strong>${diretas}</strong><br>vendas indiretas: <strong>${indiretas}</strong>`;
    t.classList.add("ativo");
    t.style.left = Math.min(e.clientX + 12, window.innerWidth - 230) + "px";
    t.style.top  = Math.min(e.clientY - 20, window.innerHeight - 140) + "px";
  }

  document.addEventListener("click", e => {
    const t = document.getElementById("tooltip");
    if (!t.contains(e.target) && !e.target.classList.contains("bolinha")) {
      t.classList.remove("ativo");
    }
  });

  window.copiar = () => {
    navigator.clipboard.writeText(document.getElementById("link").textContent).then(() => {
      const fb = document.getElementById("fb");
      fb.textContent = "copiado.";
      setTimeout(() => fb.textContent = "", 2000);
    });
  };

  // ── TIMEOUT DE INATIVIDADE (15 minutos) ──
  let timer;
  function resetTimer() {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      await signOut(auth);
      location.href = "index.html";
    }, 15 * 60 * 1000);
  }
  ["mousemove", "keydown", "click", "touchstart", "scroll"].forEach(ev =>
    document.addEventListener(ev, resetTimer)
  );
  resetTimer();

  window.sair = async () => {
    await signOut(auth);
    location.href = "index.html";
  };
</script>

</body>
</html>
