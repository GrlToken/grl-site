<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRL Network</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      font-family: Consolas, monospace;
      color: #003366;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid rgba(0,51,102,0.12);
    }

    .email { font-size: 12px; opacity: .5; }

    button {
      font-family: Consolas, monospace;
      font-size: 11px;
      color: #003366;
      background: transparent;
      border: 1px solid rgba(0,51,102,0.25);
      border-radius: 8px;
      padding: 5px 12px;
      cursor: pointer;
    }

    .main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: calc(100vh - 49px);
    }

    .col {
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .col:first-child { border-right: 1px solid rgba(0,51,102,0.10); }

    .rotulo {
      font-size: 10px;
      letter-spacing: 3px;
      opacity: .3;
      text-transform: uppercase;
      margin-bottom: 32px;
      align-self: flex-start;
    }

    svg { width: 100%; max-width: 300px; }

    circle { fill: #003366; }
    circle.vazio { fill: none; stroke: #003366; stroke-width: 1.5; opacity: .2; }
    line { stroke: #003366; stroke-width: 1; opacity: .12; }

    text {
      font-family: Consolas, monospace;
      fill: #003366;
      text-anchor: middle;
      dominant-baseline: middle;
      font-size: 9px;
      opacity: .5;
    }

    text.nome { font-size: 10px; opacity: .8; }

    .link-area { margin-top: 40px; width: 100%; max-width: 300px; }

    .link-rotulo {
      font-size: 10px;
      letter-spacing: 2px;
      opacity: .3;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .link {
      font-size: 10px;
      background: rgba(0,51,102,0.04);
      border: 1px solid rgba(0,51,102,0.12);
      border-radius: 8px;
      padding: 10px 12px;
      word-break: break-all;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .fila { width: 100%; list-style: none; align-self: flex-start; margin-top: 48px; }

    .fila li {
      display: flex;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid rgba(0,51,102,0.08);
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 11px;
    }

    .fila .pos { opacity: .3; min-width: 16px; }
    .fila .n   { flex: 1; opacity: .7; }
    .fila .g   { opacity: .35; }

    .vazio-msg { font-size: 11px; opacity: .25; margin-top: 16px; }

    @media (max-width: 600px) {
      .main { grid-template-columns: 1fr; }
      .col:first-child { border-right: none; border-bottom: 1px solid rgba(0,51,102,0.10); }
    }
  </style>
</head>
<body>

<header>
  <span class="email" id="email"></span>
  <button onclick="sair()">Sair</button>
</header>

<div class="main">

  <div class="col">
    <div class="rotulo">matriz</div>

    <svg viewBox="0 0 300 260">
      <line x1="150" y1="65" x2="75"  y2="180"/>
      <line x1="150" y1="65" x2="225" y2="180"/>

      <circle cx="150" cy="55" r="22"/>
      <text x="150" y="49">eu</text>
      <text x="150" y="60" class="nome" id="eu-nome"></text>

      <circle cx="75"  cy="185" r="18" class="vazio" id="circ-ultra"/>
      <text x="75"  y="179">ultra</text>
      <text x="75"  y="190" class="nome" id="ultra-nome"></text>

      <circle cx="225" cy="185" r="18" class="vazio" id="circ-super"/>
      <text x="225" y="179">super</text>
      <text x="225" y="190" class="nome" id="super-nome"></text>
    </svg>

    <div class="link-area">
      <div class="link-rotulo">link de convite</div>
      <div class="link" id="link"></div>
      <button onclick="copiar()">Copiar</button>
      <div style="font-size:10px;opacity:.35;margin-top:6px;min-height:14px" id="fb"></div>
    </div>
  </div>

  <div class="col">
    <div class="rotulo">fila</div>
    <ul class="fila" id="fila"></ul>
  </div>

</div>

<script type="module">
  import { auth, db } from "./firebase.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { collection, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  onAuthStateChanged(auth, async user => {
    if (!user) { location.href = "index.html"; return; }

    document.getElementById("email").textContent = user.email;
    document.getElementById("eu-nome").textContent = user.email.split("@")[0];

    const link = `https://grlnetwork.com/cadastro.html?ref=${user.uid}`;
    document.getElementById("link").textContent = link;

    const snap = await getDocs(query(
      collection(db, "usuarios"),
      where("sponsor", "==", user.uid),
      orderBy("grade", "desc"),
      orderBy("ts", "asc")
    ));

    const lista = [];
    snap.forEach(d => lista.push(d.data()));

    if (lista[0]) {
      document.getElementById("circ-ultra").classList.remove("vazio");
      document.getElementById("ultra-nome").textContent = lista[0].email.split("@")[0];
    }
    if (lista[1]) {
      document.getElementById("circ-super").classList.remove("vazio");
      document.getElementById("super-nome").textContent = lista[1].email.split("@")[0];
    }

    const fila = document.getElementById("fila");
    fila.innerHTML = !lista.length
      ? '<li class="vazio-msg">nenhum indicado ainda</li>'
      : lista.map((u, i) => `
          <li>
            <span class="pos">${i + 1}</span>
            <span class="n">${u.email.split("@")[0]}</span>
            <span class="g">${u.grade > 0 ? "g" + u.grade : "—"}</span>
          </li>`).join("");
  });

  window.copiar = () => {
    navigator.clipboard.writeText(document.getElementById("link").textContent).then(() => {
      const fb = document.getElementById("fb");
      fb.textContent = "copiado.";
      setTimeout(() => fb.textContent = "", 2000);
    });
  };

  window.sair = async () => {
    await signOut(auth);
    location.href = "index.html";
  };
</script>

</body>
</html>
